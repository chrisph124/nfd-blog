allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 1440  # minutes; 24h supply-chain delay (explicit pin to pnpm 11 default)

overrides:
  vite: 8.0.16
  'markdown-it@<14.2.0': '>=14.2.0'
  'linkify-it@<=5.0.0': '>=5.0.1'
  '@babel/core@<=7.29.0': '>=7.29.6 <8'
  'js-yaml@<4.3.2': '>=4.3.2 <5'
  'minimatch@<3.1.3': '>=3.1.3'
  'minimatch@<3.1.4': '>=3.1.4'
  'ajv@<6.14.0': '~6.14.0'
  'flatted@<3.4.0': '>=3.4.0'
  'flatted@<=3.4.1': '>=3.4.2'
  'brace-expansion@<5.0.12': '>=5.0.12'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'postcss@<8.5.18': '>=8.5.18'
  'ws@<8.20.1': '>=8.20.1'
  'sharp@<0.35.4': '>=0.35.4'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS: no patched release exists. Reached only
    # through @next/eslint-plugin-next > fast-glob > micromatch (lint tooling, never
    # shipped), and exploiting it needs attacker-controlled glob patterns.
    # Remove once a fixed braces ships or the plugin drops it.
    - GHSA-vfj7-8cjw-p6xm
