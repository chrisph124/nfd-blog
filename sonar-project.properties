sonar.projectKey=chrisph124_nfd-blog
sonar.organization=chrisph124

sonar.projectName=NFD Blog
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.ts,src/__tests__/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/coverage/**

# Keep the coverage metric scoped to authored code, mirroring the vitest
# coverage.exclude list: vendored shadcn/ui primitives (generated by the CLI,
# exercised indirectly), generated type declarations, and test-support helpers
# under src/__tests__ (e.g. test-mocks.*, which are test code — not source, and
# not matched by the *.test.* exclusion) are analyzed for issues but not counted
# toward coverage.
sonar.coverage.exclusions=src/components/ui/**,src/types/**,src/app/layout.tsx,**/index.ts,src/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
