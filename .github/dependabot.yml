version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Supply-chain delay mirroring pnpm-workspace.yaml minimumReleaseAge (24h).
    # Patch waits 1 day (parity); riskier bumps wait longer before a PR opens.
    cooldown:
      default-days: 1
      semver-patch-days: 1
      semver-minor-days: 3
      semver-major-days: 7
    # Group only non-breaking bumps (minor/patch); major bumps get isolated
    # single-package PRs so breaking upgrades are reviewed individually.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # github-actions ecosystem supports only default-days for cooldown
    # (no semver-level granularity); 1 day keeps 24h parity for actions.
    cooldown:
      default-days: 1
