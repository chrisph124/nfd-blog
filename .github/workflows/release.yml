name: Release

# Safety net for version tags pushed without a release: open a draft with auto-generated
# notes, sectioned by .github/release.yml, to rewrite in the release-notes template before
# publishing (generated items carry PR references, which published notes omit). A release
# that already exists is left untouched.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its notes untouched."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" "${flags[@]}"
