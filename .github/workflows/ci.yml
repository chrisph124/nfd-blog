name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for SonarCloud

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.2.2'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Run ESLint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_STORYBLOK_CONTENT_API_ACCESS_TOKEN: ${{ secrets.STORYBLOK_TOKEN }}

      # PR decoration is via the SonarCloud GitHub App, not GITHUB_TOKEN —
      # contents: read is sufficient for this step.
      # Coverage upload is reporting, not a merge gate: a SonarCloud outage
      # (e.g. HTTP 500 on report upload) must not fail the required job. The
      # SonarCloud quality gate reports separately via its own status check.
      - name: Upload coverage to SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
